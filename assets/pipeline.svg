<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How pushback works: extract your messages from Claude Code transcripts, label them, audit a sample, then report correction rates, draft CLAUDE.md rules, or export preference pairs."><title>How pushback works: extract your messages from Claude Code transcripts, label them, audit a sample, then report correction rates, draft CLAUDE.md rules, or export preference pairs.</title><style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:1.2px;}
.blob{animation:float 14s ease-in-out infinite alternate;}
.b2{animation-duration:18s;animation-direction:alternate-reverse;} .b3{animation-duration:22s;}
@keyframes float{from{transform:translate(0,0) scale(1);} to{transform:translate(60px,-40px) scale(1.15);}}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.25;}}
.rot{opacity:0;animation:rot 12s infinite both;}
@keyframes rot{0%{opacity:0;transform:translateY(16px);} 4%,29%{opacity:1;transform:translateY(0);} 33%,100%{opacity:0;transform:translateY(-16px);}}
.move{animation:move 2.6s linear infinite;}
@keyframes move{from{transform:translateX(0);opacity:0;} 15%{opacity:1;} 85%{opacity:1;} to{transform:translateX(var(--dx,120px));opacity:0;}}
.shine{animation:shine 6s linear infinite;}
@keyframes shine{from{transform:translateX(-400px);} to{transform:translateX(1400px);}}
.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) both;}
@keyframes enter{from{transform:translateY(-14px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.growx{animation:growx 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left;}
@keyframes growx{from{transform:scaleX(0);} to{transform:scaleX(1);}}
.type{animation:type 7s steps(1) infinite both;}
@keyframes type{0%{opacity:0;} 18%,100%{opacity:1;}}
.t2{animation-name:type2;} @keyframes type2{0%{opacity:0;} 42%,100%{opacity:1;}}
.t3{animation-name:type3;} @keyframes type3{0%{opacity:0;} 66%,100%{opacity:1;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;} .rot{opacity:0;} .r0{opacity:1;}}
</style><defs>
<linearGradient id="sun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB224"/><stop offset=".5" stop-color="#FF5C39"/><stop offset="1" stop-color="#FF3D9A"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB224" stop-opacity=".9"/><stop offset=".5" stop-color="#FF3D9A" stop-opacity=".35"/><stop offset="1" stop-color="#5B8CFF" stop-opacity=".8"/></linearGradient>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#26263D"/></pattern>
</defs><clipPath id="clip"><rect width="1200" height="300" rx="20"/></clipPath><g clip-path="url(#clip)"><rect width="1200" height="300" fill="#0A0A14"/><g filter="url(#blur)" opacity=".5"><circle class="blob" cx="144" cy="60" r="96" fill="#FF5C39"/><circle class="blob b2" cx="960" cy="255" r="90" fill="#5B8CFF"/><circle class="blob b3" cx="660" cy="30" r="66" fill="#FF3D9A"/></g><rect width="1200" height="300" fill="url(#dots)" opacity=".6"/><text x="64" y="54" class="sans" font-size="24" font-weight="800" fill="#F6F4FF">How it works</text><g class="enter" style="animation-delay:0.00s"><rect x="64" y="90" width="210" height="150" rx="16" fill="#12121F" stroke="#FF5C39" stroke-opacity=".6"/><text x="84" y="124" class="mono" font-size="13" font-weight="700" fill="#FF5C39">01 · EXTRACT</text><text x="84" y="170" class="sans" font-size="16" fill="#F6F4FF">your messages from</text><text x="84" y="194" class="sans" font-size="16" fill="#A3A1BE">Claude Code transcripts</text></g><line x1="278" y1="165" x2="310" y2="165" stroke="#26263D" stroke-width="2"/><circle class="move" style="--dx:32px;animation-delay:0.0s" cx="278" cy="165" r="4" fill="#FF5C39" filter="url(#glow)"/><g class="enter" style="animation-delay:0.15s"><rect x="314" y="90" width="210" height="150" rx="16" fill="#12121F" stroke="#FFB224" stroke-opacity=".6"/><text x="334" y="124" class="mono" font-size="13" font-weight="700" fill="#FFB224">02 · LABEL</text><text x="334" y="170" class="sans" font-size="16" fill="#F6F4FF">task + correction</text><text x="334" y="194" class="sans" font-size="16" fill="#A3A1BE">per message, by Claude</text></g><line x1="528" y1="165" x2="560" y2="165" stroke="#26263D" stroke-width="2"/><circle class="move" style="--dx:32px;animation-delay:0.4s" cx="528" cy="165" r="4" fill="#FFB224" filter="url(#glow)"/><g class="enter" style="animation-delay:0.30s"><rect x="564" y="90" width="210" height="150" rx="16" fill="#12121F" stroke="#A3F547" stroke-opacity=".6"/><text x="584" y="124" class="mono" font-size="13" font-weight="700" fill="#A3F547">03 · AUDIT</text><text x="584" y="170" class="sans" font-size="16" fill="#F6F4FF">hand-check a sample</text><text x="584" y="194" class="sans" font-size="16" fill="#A3A1BE">to bound the error</text></g><line x1="778" y1="165" x2="810" y2="165" stroke="#26263D" stroke-width="2"/><circle class="move" style="--dx:32px;animation-delay:0.8s" cx="778" cy="165" r="4" fill="#A3F547" filter="url(#glow)"/><g class="enter" style="animation-delay:0.50s"><rect x="820" y="78" width="316" height="50" rx="14" fill="#12121F" stroke="#FF3D9A" stroke-opacity=".6"/><text x="840" y="109" class="mono" font-size="13" font-weight="700" fill="#FF3D9A">REPORT</text><text x="930" y="109" class="sans" font-size="15" fill="#F6F4FF">rate per task, with CIs</text></g><path d="M 778 165 C 800 165, 800 103, 820 103" fill="none" stroke="#26263D" stroke-width="2"/><g class="enter" style="animation-delay:0.65s"><rect x="820" y="140" width="316" height="50" rx="14" fill="#12121F" stroke="#5B8CFF" stroke-opacity=".6"/><text x="840" y="171" class="mono" font-size="13" font-weight="700" fill="#5B8CFF">RULES</text><text x="930" y="171" class="sans" font-size="15" fill="#F6F4FF">CLAUDE.md rules that stick</text></g><path d="M 778 165 C 800 165, 800 165, 820 165" fill="none" stroke="#26263D" stroke-width="2"/><g class="enter" style="animation-delay:0.80s"><rect x="820" y="202" width="316" height="50" rx="14" fill="#12121F" stroke="#B794FF" stroke-opacity=".6"/><text x="840" y="233" class="mono" font-size="13" font-weight="700" fill="#B794FF">EXPORT</text><text x="930" y="233" class="sans" font-size="15" fill="#F6F4FF">prompt / chosen / rejected</text></g><path d="M 778 165 C 800 165, 800 227, 820 227" fill="none" stroke="#26263D" stroke-width="2"/></g><rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/></svg>