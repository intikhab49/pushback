<g class="type"><rect x="720" y="58" width="420" height="74" rx="14" fill="#12121F" stroke="#5B8CFF" stroke-opacity=".6"/><text x="738" y="80" class="mono" font-size="10" fill="#5B8CFF">AGENT</text><text x="738" y="104" class="sans" font-size="15" fill="#F6F4FF">Here's the post. It opens with context,</text><text x="738" y="124" class="sans" font-size="15" fill="#F6F4FF">then the result lands at the end.</text></g><g class="type t2"><rect x="760" y="158" width="380" height="74" rx="14" fill="#12121F" stroke="#FF5C39" stroke-opacity=".6"/><text x="778" y="180" class="mono" font-size="10" fill="#FF5C39">YOU · PUSHBACK</text><text x="778" y="204" class="sans" font-size="15" fill="#F6F4FF">no, the last line is the hook.</text><text x="778" y="224" class="sans" font-size="15" fill="#F6F4FF">put it first.</text></g><g class="type t3"><rect x="720" y="258" width="420" height="74" rx="14" fill="#12121F" stroke="#A3F547" stroke-opacity=".6"/><text x="738" y="280" class="mono" font-size="10" fill="#A3F547">PUSHBACK RULES</text><text x="738" y="304" class="sans" font-size="15" fill="#F6F4FF">Put the strongest line first.</text><text x="738" y="324" class="sans" font-size="15" fill="#F6F4FF">3 corrections · rule drafted</text></g>
