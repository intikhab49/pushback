<text class="sans rot r0" style="animation-delay:0s" x="64" y="238" font-size="30" font-weight="700" fill="#F6F4FF">How often do you <tspan fill="#FF5C39">correct your coding agent?</tspan></text><text class="sans rot" style="animation-delay:4s" x="64" y="238" font-size="30" font-weight="700" fill="#F6F4FF">Which of your rules <tspan fill="#FF3D9A">does it keep breaking?</tspan></text><text class="sans rot" style="animation-delay:8s" x="64" y="238" font-size="30" font-weight="700" fill="#F6F4FF">Where does it need <tspan fill="#A3F547">a second correction?</tspan></text>
