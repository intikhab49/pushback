<rect x="64" y="318" width="144" height="26" rx="13" fill="#12121F" stroke="#FF3D9A" stroke-opacity=".55"/><text x="77" y="335.5" class="mono" font-size="11" fill="#FF3D9A">PREFERENCE PAIRS</text><rect x="218.4" y="318" width="100" height="26" rx="13" fill="#12121F" stroke="#5B8CFF" stroke-opacity=".55"/><text x="231.4" y="335.5" class="mono" font-size="11" fill="#5B8CFF">HAND AUDIT</text><rect x="328.4" y="318" width="115" height="26" rx="13" fill="#12121F" stroke="#B794FF" stroke-opacity=".55"/><text x="341.4" y="335.5" class="mono" font-size="11" fill="#B794FF">RUNS LOCALLY</text>
